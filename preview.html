<!DOCTYPE html>
<html lang="zh">
<head>
	<meta name="referrer" content="no-referrer">
	<meta charset="UTF-8">
	<meta http-equiv="X-UA-Compatible" content="IE=edge,chrome=1">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>文件预览插件</title>
	<!--
	  只保留所有文件类型都要用的样式。viewer / luckysheet / pptxjs / prism / audio 的 CSS
	  改为在 jPreview 识别出文件类型后按需加载（dynamicLoadCss），避免预览一张 jpg
	  也要先下 300KB 用不上的表格样式。
	-->
	<link rel="stylesheet" href="static/common/css/main.css">
	<style>
		/* 载入浮层：内联在首屏，保证 main.css 未到达时进度也能立刻显示 */
		html, body { margin: 0; padding: 0; height: 100%; }
		#jp-loading {
			position: fixed; inset: 0; z-index: 99999;
			display: flex; align-items: center; justify-content: center;
			background: #0f172a;
			font: 14px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
			color: #e2e8f0;
		}
		#jp-loading.jp-hidden { display: none; }
		.jp-loading-card { width: min(420px, calc(100vw - 48px)); text-align: center; }
		.jp-loading-name {
			font-size: 15px; font-weight: 600; color: #f1f5f9; margin-bottom: 18px;
			overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
		}
		.jp-loading-bar {
			height: 6px; border-radius: 3px; background: rgba(148, 163, 184, 0.25); overflow: hidden;
		}
		.jp-loading-fill {
			height: 100%; width: 0; border-radius: 3px;
			background: linear-gradient(90deg, #38bdf8, #6366f1);
			transition: width 0.2s ease;
		}
		/* 拿不到 Content-Length 时退化成来回滚动的不确定进度条 */
		.jp-loading-bar.jp-indeterminate .jp-loading-fill {
			width: 35%; transition: none; animation: jp-slide 1.1s ease-in-out infinite;
		}
		@keyframes jp-slide {
			0% { margin-left: -35%; }
			100% { margin-left: 100%; }
		}
		.jp-loading-stats {
			margin-top: 12px; font-size: 13px; color: #94a3b8;
			font-variant-numeric: tabular-nums;
			display: flex; align-items: center; justify-content: center;
			flex-wrap: wrap; gap: 4px 10px;
		}
		.jp-loading-percent { color: #f1f5f9; font-weight: 600; font-size: 15px; }
		.jp-loading-speed { color: #38bdf8; }
		.jp-loading-error { color: #fca5a5; margin-top: 14px; font-size: 13px; }
		.jp-loading-error a { color: #7dd3fc; }
	</style>
</head>
<body>
<div id="el-app">
	<div id="container">
	</div>
</div>

<div id="jp-loading">
	<div class="jp-loading-card">
		<div class="jp-loading-name" id="jp-loading-name">资源加载中…</div>
		<div class="jp-loading-bar jp-indeterminate" id="jp-loading-bar"><div class="jp-loading-fill" id="jp-loading-fill"></div></div>
		<div class="jp-loading-stats" id="jp-loading-stats"><span>正在连接…</span></div>
		<div class="jp-loading-error" id="jp-loading-error" style="display:none"></div>
	</div>
</div>

<script type="text/javascript" src="static/jquery-2.0.3.min.js"></script>
<script type="text/javascript" src="static/jPreview.js?v6"></script>
<script>
	(function () {
		// 获取url中的src/url参数和ext参数；mode=preview 时渲染 HTML
		var urlParams = new URLSearchParams(window.location.search);
		var src = urlParams.get('src') || urlParams.get('url') || '';
		var ext = urlParams.get('ext') || '';
		var name = urlParams.get('name') || '';
		var mode = urlParams.get('mode') || '';

		jPreview.preview({
			container: "container",
			staticPath: "./static",
			url: src,
			ext: ext,
			name: name,
			mode: mode,
			watermarkSize: "",
			priority: 1,
			oburl: "",
		});
	})();
</script>
</body>
</html>
